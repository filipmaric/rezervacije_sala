<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Резервације учионица</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #999; padding: 5px 10px; text-align: center; width: 150px;  }
        th { background-color: #f0f0f0; }
        .weekly { background-color: #d1e7dd; }
        .reservation { background-color: #f8d7da; }
	.empty-slot { background-color: #f0f0f0; }
	.hover { background-color: #d0ebff; }

	/* Onemogući selekciju teksta u tabeli */
	#occupancy {
	    user-select: none;
	    -webkit-user-select: none;
	    -moz-user-select: none;
	    -ms-user-select: none;
	}

	#auth-container {
	    margin-bottom: 10px;
	}

	#login-info {
	    margin: 0px;
	    padding: 0px;
	}
    </style>
</head>
<body>
  <h1>Резервације учионица</h1>

  <div id="auth-container">
    <form id="login-form">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <div id="logout-form" style="display:none">
      <p id='login-info'></p>
      <button id="logout">Logout</button>
    </div>
  </div>

  <label for="date">Datum:</label>
  <input type="date" id="date" value="">
  <button id="prev">&lt;&lt;</button>
  <button id="next">&gt;&gt;</button>
  <button id="load">Prikaži</button>

  <div id="occupancy"></div>

  <script src="/static/main.js"></script>
</body>
</html>
