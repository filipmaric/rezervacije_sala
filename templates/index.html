<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Резервације учионица</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>
  <main class="page-shell main-page-shell">
    <header class="main-page-header">
      <div class="main-page-title">
        <h1>Резервације учионица</h1>
      </div>

      <section class="main-toolbar" aria-label="Основне контроле">
        <div class="main-toolbar-row main-toolbar-row-auth">
          <div id="auth-container" class="auth-panel">
            <form id="login-form" autocomplete="off" autocapitalize="off" autocorrect="off">
                <input type="text" id="username" name="username" placeholder="Корисничко име" required autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
                <input type="password" id="password" name="password" placeholder="Лозинка" required autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false">
                <button type="submit">Пријава</button>
            </form>

            <div id="logout-form" style="display:none">
              <p id="login-info"></p>
              <button id="logout">Одјава</button>
            </div>
          </div>

          <p id="my-reservations-wrap" class="toolbar-link-wrap" style="display:none">
            <a id="my-reservations-link" href="{{ url_for('reservations_views.my_reservations_view') }}">Моје резервације</a>
          </p>
        </div>

        <div class="main-toolbar-row main-toolbar-row-date">
          <div class="date-control">
            <label for="date-input">Датум</label>
            <div class="date-control-inputs">
              <button id="date-prev" type="button" aria-label="Prethodni dan">&lt;&lt;</button>
              <input type="date" id="date-input" value="">
              <button id="date-next" type="button" aria-label="Sledeći dan">&gt;&gt;</button>
            </div>
          </div>
        </div>
      </section>
    </header>

    <div id="occupancy"></div>
  </main>

  <script>
    window.APP_CONFIG = {
        BASE_PATH: "{{ url_for('main.index') }}".replace(/\/$/, "") 
    };
  </script>
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
